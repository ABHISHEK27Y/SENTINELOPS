# ExternalSecret resource for SentinelOps production secrets
# Requires: External Secrets Operator (https://external-secrets.io/)
# Install: kubectl apply -f https://github.com/external-secrets/external-secrets/releases/latest/download/external-secrets.yaml
#
# This file is a TEMPLATE - customize for your secret store (AWS, Vault, GCP, Azure, etc.)
# DO NOT COMMIT REAL SECRETS - this file shows the STRUCTURE only

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # Use IRSA (IAM Roles for Service Accounts) in production
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets-system
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sentinelops-secrets
  namespace: sentinelops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: sentinelops-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Ensure DATABASE_URL is properly formatted
        DATABASE_URL: '{{ .DATABASE_URL }}'
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: sentinelops/production/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: sentinelops/production/redis-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: sentinelops/production/jwt-secret
    - secretKey: POSTGRES_USER
      remoteRef:
        key: sentinelops/production/postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: sentinelops/production/postgres-password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: sentinelops/production/postgres-db
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: sentinelops/production/anthropic-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: sentinelops/production/openai-api-key
    - secretKey: OPENAI_BASE_URL
      remoteRef:
        key: sentinelops/production/openai-base-url
