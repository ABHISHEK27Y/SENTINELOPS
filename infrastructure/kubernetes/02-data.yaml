# Postgres (pgvector) + Redis. For local kind/minikube only — in AWS these are
# RDS + ElastiCache (see infrastructure/terraform). Requires a default StorageClass.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: sentinelops }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: redis-data, namespace: sentinelops }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sentinelops
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          image: pgvector/pgvector:pg16
          envFrom:
            - secretRef: { name: sentinelops-secrets }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ['pg_isready', '-U', 'sentinel', '-d', 'sentinelops'] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: postgres-run, mountPath: /var/run/postgresql }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: postgres-run, emptyDir: {} }
        - name: pgdata
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: sentinelops }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sentinelops
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          image: redis:7-alpine
          args: ['redis-server', '--appendonly', 'yes']
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: redisdata, mountPath: /data }
          readinessProbe:
            exec: { command: ['redis-cli', 'ping'] }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: redisdata
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: sentinelops }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
