---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-provider-https-egress
  namespace: sentinelops
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
