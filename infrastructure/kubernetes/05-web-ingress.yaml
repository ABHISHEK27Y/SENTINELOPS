apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: sentinelops }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: sentinelops/app:local
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "dev", "-w", "@sentinelops/web"]
          env:
            - { name: NODE_ENV, value: "development" }
            - { name: NEXT_PUBLIC_API_URL, value: "http://sentinelops.local" }
            - { name: NEXT_PUBLIC_WS_URL, value: "ws://sentinelops.local/ws" }
          ports: [{ containerPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: sentinelops }
spec: { selector: { app: web }, ports: [{ port: 3000, targetPort: 3000 }] }
---
# Single host, path-routed: /api + /ws → api, everything else → web dashboard.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelops
  namespace: sentinelops
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: sentinelops.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 4000 } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: api, port: { number: 4000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 3000 } } }
