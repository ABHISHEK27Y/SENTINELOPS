# Kafka in KRaft mode (single broker, dev). Production uses MSK (see terraform).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: kafka-data, namespace: sentinelops }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: sentinelops
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_NODE_ID, value: '1' }
            - { name: KAFKA_PROCESS_ROLES, value: 'broker,controller' }
            - { name: KAFKA_LISTENERS, value: 'PLAINTEXT://:9092,CONTROLLER://:9093' }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: 'PLAINTEXT://kafka:9092' }
            - {
                name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP,
                value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT',
              }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: 'CONTROLLER' }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@localhost:9093' }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: 'PLAINTEXT' }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1' }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: 'true' }
            - { name: KAFKA_NUM_PARTITIONS, value: '3' }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk }
          volumeMounts:
            - { name: kafkadata, mountPath: /var/lib/kafka/data }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: kafkadata
          persistentVolumeClaim: { claimName: kafka-data }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: sentinelops }
spec:
  selector: { app: kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
