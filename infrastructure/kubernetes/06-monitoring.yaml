# Generated by scripts/generate-monitoring.mjs. Local demo; Jaeger traces are ephemeral.
{
  'apiVersion': 'v1',
  'kind': 'PersistentVolumeClaim',
  'metadata': { 'name': 'prometheus-data', 'namespace': 'sentinelops' },
  'spec': { 'accessModes': ['ReadWriteOnce'], 'resources': { 'requests': { 'storage': '2Gi' } } },
}
---
{
  'apiVersion': 'apps/v1',
  'kind': 'Deployment',
  'metadata': { 'name': 'prometheus', 'namespace': 'sentinelops' },
  'spec':
    {
      'replicas': 1,
      'strategy': { 'type': 'Recreate' },
      'selector': { 'matchLabels': { 'app': 'prometheus' } },
      'template':
        {
          'metadata': { 'labels': { 'app': 'prometheus' } },
          'spec':
            {
              'securityContext': { 'fsGroup': 10001 },
              'containers':
                [
                  {
                    'name': 'prometheus',
                    'image': 'prom/prometheus:v2.55.0',
                    'args':
                      [
                        '--config.file=/etc/prometheus/prometheus.yml',
                        '--storage.tsdb.path=/prometheus',
                        '--storage.tsdb.retention.time=6h',
                      ],
                    'ports': [{ 'containerPort': 9090 }],
                    'volumeMounts':
                      [
                        { 'name': 'data', 'mountPath': '/prometheus' },
                        {
                          'name': 'prometheus-config',
                          'mountPath': '/etc/prometheus',
                          'readOnly': true,
                        },
                        {
                          'name': 'prometheus-alerts',
                          'mountPath': '/etc/prometheus/alerts',
                          'readOnly': true,
                        },
                      ],
                    'readinessProbe':
                      {
                        'httpGet': { 'path': '/-/ready', 'port': 9090 },
                        'initialDelaySeconds': 10,
                        'periodSeconds': 10,
                      },
                    'resources':
                      {
                        'requests': { 'cpu': '100m', 'memory': '128Mi' },
                        'limits': { 'cpu': '1', 'memory': '512Mi' },
                      },
                  },
                ],
              'volumes':
                [
                  { 'name': 'prometheus-config', 'configMap': { 'name': 'prometheus-config' } },
                  { 'name': 'prometheus-alerts', 'configMap': { 'name': 'prometheus-alerts' } },
                  { 'name': 'data', 'persistentVolumeClaim': { 'claimName': 'prometheus-data' } },
                ],
            },
        },
    },
}
---
{
  'apiVersion': 'v1',
  'kind': 'Service',
  'metadata': { 'name': 'prometheus', 'namespace': 'sentinelops' },
  'spec':
    {
      'selector': { 'app': 'prometheus' },
      'ports': [{ 'name': 'port-9090', 'port': 9090, 'targetPort': 9090 }],
    },
}
