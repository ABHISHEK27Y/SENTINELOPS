# SentinelOps application tier. All pods run the one shared image
# (sentinelops/app:local) and differ only by the workspace command + env.
# Build + load the image into your cluster first, e.g.:
#   docker build -t sentinelops/app:local .
#   kind load docker-image sentinelops/app:local   # (or minikube image load)

# One-shot DB migration; the api/engines assume the schema exists.
apiVersion: batch/v1
kind: Job
metadata: { name: migrate, namespace: sentinelops }
spec:
  backoffLimit: 5
  template:
    metadata: { labels: { app: migrate } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: OnFailure
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: migrate
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          image: sentinelops/app:local
          imagePullPolicy: IfNotPresent
          command: ['npm', 'run', 'db:migrate']
          env: [{ name: NPM_CONFIG_CACHE, value: /tmp/npm }]
          envFrom:
            - configMapRef: { name: sentinelops-config }
            - secretRef: { name: sentinelops-secrets }
          resources:
            limits:
              memory: '256Mi'
              cpu: '200m'
            requests:
              memory: '128Mi'
              cpu: '100m'
---
# ── Data-plane services ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-service, namespace: sentinelops }
spec:
  replicas: 2
  selector: { matchLabels: { app: payment-service } }
  template:
    metadata: { labels: { app: payment-service } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: payment-service
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          image: sentinelops/app:local
          imagePullPolicy: IfNotPresent
          command: ['npm', 'run', 'start', '-w', '@sentinelops/payment-service']
          envFrom:
            [
              { configMapRef: { name: sentinelops-config } },
              { secretRef: { name: sentinelops-secrets } },
            ]
          env:
            [
              { name: NPM_CONFIG_CACHE, value: /tmp/npm },
              { name: PAYMENT_SERVICE_PORT, value: '8083' },
            ]
          ports: [{ containerPort: 8083 }]
          readinessProbe:
            {
              httpGet: { path: /health/ready, port: 8083 },
              initialDelaySeconds: 8,
              periodSeconds: 10,
            }
          livenessProbe:
            {
              httpGet: { path: /health/live, port: 8083 },
              initialDelaySeconds: 15,
              periodSeconds: 15,
            }
          resources:
            limits:
              memory: '512Mi'
              cpu: '500m'
            requests:
              memory: '256Mi'
              cpu: '250m'
---
apiVersion: v1
kind: Service
metadata: { name: payment-service, namespace: sentinelops }
spec: { selector: { app: payment-service }, ports: [{ port: 8083, targetPort: 8083 }] }
