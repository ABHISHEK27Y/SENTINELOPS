apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: sentinelops }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          image: sentinelops/app:local
          imagePullPolicy: IfNotPresent
          command: ['npm', 'run', 'start', '-w', '@sentinelops/api']
          envFrom:
            [
              { configMapRef: { name: sentinelops-config } },
              { secretRef: { name: sentinelops-secrets } },
            ]
          env: [{ name: NPM_CONFIG_CACHE, value: /tmp/npm }, { name: API_PORT, value: '4000' }]
          ports: [{ containerPort: 4000 }, { containerPort: 4001 }]
          readinessProbe:
            {
              httpGet: { path: /api/ready, port: 4000 },
              initialDelaySeconds: 10,
              periodSeconds: 10,
            }
          resources:
            limits:
              memory: '512Mi'
              cpu: '500m'
            requests:
              memory: '256Mi'
              cpu: '250m'
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: sentinelops }
spec:
  {
    selector: { app: api },
    ports:
      [
        { name: http, port: 4000, targetPort: 4000 },
        { name: metrics, port: 4001, targetPort: 4001 },
      ],
  }
