# SentinelOps application tier. All pods run the one shared image
# (sentinelops/app:local) and differ only by the workspace command + env.
# Build + load the image into your cluster first, e.g.:
#   docker build -t sentinelops/app:local .
#   kind load docker-image sentinelops/app:local   # (or minikube image load)

# One-shot DB migration; the api/engines assume the schema exists.
apiVersion: batch/v1
kind: Job
metadata: { name: migrate, namespace: sentinelops }
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: sentinelops/app:local
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "db:migrate"]
          envFrom:
            - configMapRef: { name: sentinelops-config }
            - secretRef: { name: sentinelops-secrets }
---
# ── Data-plane services ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-service, namespace: sentinelops }
spec:
  replicas: 2
  selector: { matchLabels: { app: payment-service } }
  template:
    metadata: { labels: { app: payment-service } }
    spec:
      containers:
        - name: payment-service
          image: sentinelops/app:local
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "start", "-w", "@sentinelops/payment-service"]
          envFrom: [{ configMapRef: { name: sentinelops-config } }, { secretRef: { name: sentinelops-secrets } }]
          env: [{ name: PAYMENT_SERVICE_PORT, value: "8083" }]
          ports: [{ containerPort: 8083 }]
          readinessProbe: { httpGet: { path: /health/ready, port: 8083 }, initialDelaySeconds: 8, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: 8083 }, initialDelaySeconds: 15, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: payment-service, namespace: sentinelops }
spec: { selector: { app: payment-service }, ports: [{ port: 8083, targetPort: 8083 }] }
---
