          envFrom: [{ configMapRef: { name: sentinelops-config } }, { secretRef: { name: sentinelops-secrets } }]
          env:
            - { name: ORDER_SERVICE_PORT, value: "8082" }
            - { name: PAYMENT_SERVICE_URL, value: "http://payment-service:8083" }
            - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:8084" }
          ports: [{ containerPort: 8082 }]
          readinessProbe: { httpGet: { path: /health/ready, port: 8082 }, initialDelaySeconds: 8, periodSeconds: 10 }
