# Full stack: infrastructure + observability + all data-plane services + traffic.
# Usage:  docker compose up -d --build   (then open Grafana/Jaeger/Prometheus)
# Infra + observability come from the included infra compose; this file adds the apps.
name: sentinelops

include:
  - infrastructure/docker/docker-compose.infra.yml

# Shared config for every Node service. One image, built once, reused via the tag.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: sentinelops/app:local
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_SERVICE_NAMESPACE: sentinelops
    DATABASE_URL: postgresql://sentinel:sentinel_dev_pw@postgres:5432/sentinelops
    REDIS_URL: redis://redis:6379
    KAFKA_BROKERS: kafka:29092
    KAFKA_TELEMETRY: "on"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  user-service:
    <<: *app
    container_name: sentinel-user
    command: ["npm", "run", "start", "-w", "@sentinelops/user-service"]
    environment:
      <<: *app-env
      USER_SERVICE_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  payment-service:
    <<: *app
    container_name: sentinel-payment
    command: ["npm", "run", "start", "-w", "@sentinelops/payment-service"]
    environment:
      <<: *app-env
      PAYMENT_SERVICE_PORT: "8083"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  notification-service:
    <<: *app
    container_name: sentinel-notification
    command: ["npm", "run", "start", "-w", "@sentinelops/notification-service"]
    environment:
      <<: *app-env
      NOTIFICATION_SERVICE_PORT: "8084"
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  order-service:
    <<: *app
    container_name: sentinel-order
    command: ["npm", "run", "start", "-w", "@sentinelops/order-service"]
    environment:
      <<: *app-env
      ORDER_SERVICE_PORT: "8082"
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  api-gateway:
    <<: *app
    container_name: sentinel-gateway
    command: ["npm", "run", "start", "-w", "@sentinelops/api-gateway"]
    environment:
      <<: *app-env
      API_GATEWAY_PORT: "8080"
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Continuous, realistic traffic so every service has a telemetry baseline.
  loadgen:
    <<: *app
    container_name: sentinel-loadgen
    command: ["npm", "run", "start", "-w", "@sentinelops/loadgen"]
    environment:
      GATEWAY_URL: http://api-gateway:8080
      TARGET_RPS: "8"
      ORDER_RATIO: "0.6"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      disable: true

  # ── Control plane ──────────────────────────────────────────────────────

  # One-shot: apply DB migrations, then exit. Engines wait for it to succeed.
  migrate:
    <<: *app
    container_name: sentinel-migrate
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  anomaly-engine:
    <<: *app
    container_name: sentinel-anomaly
    command: ["npm", "run", "start", "-w", "@sentinelops/anomaly-engine"]
    environment:
      <<: *app-env
      ANOMALY_ENGINE_PORT: "8091"
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  incident-engine:
    <<: *app
    container_name: sentinel-incident
    command: ["npm", "run", "start", "-w", "@sentinelops/incident-engine"]
    environment:
      <<: *app-env
      INCIDENT_ENGINE_PORT: "8090"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Diagnostic consumer: prints live event counts per topic.
  event-tap:
    <<: *app
    container_name: sentinel-eventtap
    command: ["npm", "run", "start", "-w", "@sentinelops/event-tap"]
    healthcheck:
      disable: true

  # Persistence/normalization: telemetry.events + log.events → Postgres.
  ingestor:
    <<: *app
    container_name: sentinel-ingestor
    command: ["npm", "run", "start", "-w", "@sentinelops/ingestor"]
    environment:
      <<: *app-env
      INGESTOR_PORT: "8095"
    ports:
      - "8095:8095"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8095/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Platform API: REST + WS, JWT/RBAC, investigate/remediate/failures.
  api:
    <<: *app
    container_name: sentinel-api
    command: ["npm", "run", "start", "-w", "@sentinelops/api"]
    environment:
      <<: *app-env
      API_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Next.js SRE dashboard.
  web:
    <<: *app
    container_name: sentinel-web
    command: ["npm", "run", "dev", "-w", "@sentinelops/web"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
