name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Typecheck + Lint + Format + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Knip (dead code / unused deps check)
        run: npx knip
      - name: Unit tests with coverage
        run: npm run test:coverage

  docker-build:
    name: Build image
    runs-on: ubuntu-latest
    needs: verify
    # Only build/scan/push on main.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build shared app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sentinelops/app:${{ github.sha }}
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentinelops/app:${{ github.sha }}
          format: table
          exit-code: '0' # report only; set to '1' to fail the build on findings
          severity: HIGH,CRITICAL
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: sentinelops/app:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      # Push is gated on a configured registry. Uncomment + add secrets to enable.
