name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Validate deployment source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform initialization and validation
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Render local Kubernetes and Compose
        run: |
          kubectl kustomize . > /tmp/sentinelops-local.yaml
          docker compose config --quiet
  verify:
    name: Verify (Typecheck + Lint + Format + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Dashboard production build
        run: npm run build -w @sentinelops/web
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Knip (dead code / unused deps check)
        run: npx knip
      - name: Unit tests with coverage
        run: npm run test:coverage

  docker-build:
    name: Build image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build shared app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sentinelops/app:${{ github.sha }}
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentinelops/app:${{ github.sha }}
          format: table
          exit-code: '0' # report only; set to '1' to fail the build on findings
          severity: HIGH,CRITICAL
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: sentinelops/app:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Start isolated demo stack
        run: |
          docker tag sentinelops/app:${{ github.sha }} sentinelops/app:local
          docker compose up -d --no-build --wait --wait-timeout 240
      - name: Full incident workflow smoke test
        run: node scripts/stack-smoke.mjs
      - name: Stack diagnostics and cleanup
        if: always()
        run: |
          docker compose logs --no-color > stack.log
          docker compose down
      - name: Upload stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-log
          path: stack.log
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      # Push is gated on a configured registry. Uncomment + add secrets to enable.
