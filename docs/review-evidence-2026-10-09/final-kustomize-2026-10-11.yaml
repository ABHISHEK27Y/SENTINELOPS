kind: Deployment
metadata:
  name: redis
  namespace: sentinelops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - args:
        - redis-server
        - --appendonly
        - "yes"
        image: redis:7-alpine
        name: redis
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - mountPath: /data
          name: redisdata
      volumes:
      - name: redisdata
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: sentinelops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - command:
        - npm
        - run
        - start
        - -w
        - '@sentinelops/user-service'
        env:
        - name: USER_SERVICE_PORT
          value: "8081"
        envFrom:
        - configMapRef:
            name: sentinelops-config
        - secretRef:
            name: sentinelops-secrets
        image: sentinelops/app:local
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 15
        name: user-service
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8081
          initialDelaySeconds: 8
          periodSeconds: 10
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 150m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sentinelops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - command:
        - npm
        - run
        - start
        - -w
        - '@sentinelops/web'
        env:
        - name: NODE_ENV
          value: production
        - name: NEXT_PUBLIC_API_URL
          value: http://sentinelops.local
        - name: NEXT_PUBLIC_WS_URL
          value: ws://sentinelops.local/ws
        image: sentinelops/app:local
        imagePullPolicy: IfNotPresent
        name: web
        ports:
        - containerPort: 3000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: sentinelops
spec:
  backoffLimit: 5
  template:
    spec:
      containers:
      - command:
        - npm
        - run
        - db:migrate
        envFrom:
        - configMapRef:
            name: sentinelops-config
        - secretRef:
            name: sentinelops-secrets
        image: sentinelops/app:local
        imagePullPolicy: IfNotPresent
        name: migrate
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: OnFailure
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelops
  namespace: sentinelops
spec:
  ingressClassName: nginx
  rules:
  - host: sentinelops.local
    http:
      paths:
      - backend:
          service:
            name: api
            port:
              number: 4000
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 4000
        path: /ws
        pathType: Prefix
      - backend:
          service:
            name: web
            port:
              number: 3000
        path: /
        pathType: Prefix
