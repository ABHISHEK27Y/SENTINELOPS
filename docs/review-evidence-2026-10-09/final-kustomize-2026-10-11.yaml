kind: ConfigMap
metadata:
  name: grafana-providers
  namespace: sentinelops
---
apiVersion: v1
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    limits_config:
      # Legacy boltdb history remains readable; native OTLP metadata needs TSDB.
      allow_structured_metadata: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 10MB

    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://alertmanager:9093
kind: ConfigMap
metadata:
  name: loki-config
  namespace: sentinelops
---
apiVersion: v1
data:
  config.yaml: |
    # OpenTelemetry Collector — receives OTLP from all services, exports traces to
    # Jaeger and metrics to a Prometheus-scrapeable endpoint with exemplars.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 2s
      memory_limiter:
        check_interval: 2s
        limit_percentage: 80
        spike_limit_percentage: 20
      # Add resource attributes for better correlation
      resource:
        attributes:
          - key: service.namespace
            value: 'sentinelops'
            action: insert

    exporters:
      # Traces → Jaeger (OTLP gRPC on the jaeger container).
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      # Metrics → Prometheus exposition on :8889 WITH EXEMPLARS.
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
        # Enable exemplars for metric-to-trace correlation
        enable_open_metrics: true
      # Logs → Loki for log aggregation
      loki:
        endpoint: http://loki:3100/api/v1/push
        tenant_id: 'sentinelops'
        default_labels_enabled:
          exporter: true
          job: true
          instance: true
          level: true
      # Logs → collector stdout (viewable via docker logs) for the demo.
      debug:
        verbosity: normal

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [loki, debug]
kind: ConfigMap
metadata:
  name: otel-config
  namespace: sentinelops
---
apiVersion: v1
data:
  sentinelops.yml: |
    # SentinelOps Prometheus Alerting Rules
    # These define SLI-based alerts for the platform

    groups:
      - name: sentinelops.services
        interval: 30s
        rules:
          # Data-plane services
          - alert: ServiceDown
            expr: up{job="sentinelops-services"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'Service {{ $labels.instance }} is down'
              description: '{{ $labels.job }} service {{ $labels.instance }} has been down for 2 minutes'

          - alert: ServiceHighErrorRate
            expr: |
              sum(rate(http_requests_total{job="sentinelops-services",status=~"5.."}[5m])) by (service, instance)
              /
              sum(rate(http_requests_total{job="sentinelops-services"}[5m])) by (service, instance)
              > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'High error rate on {{ $labels.service }} ({{ $labels.instance }})'
              description: 'Error rate exceeds 5% for 5 minutes'

          - alert: ServiceHighLatency
            expr: |
              histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket{job="sentinelops-services"}[5m])) by (le, service, instance)) > 2000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'High p95 latency on {{ $labels.service }} ({{ $labels.instance }})'
              description: 'p95 latency exceeds 2 seconds for 5 minutes'

          - alert: ServiceHighDbPoolUtilization
            expr: db_pool_utilization{job="sentinelops-services"} > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'DB pool utilization high on {{ $labels.service }}'
              description: 'Database connection pool utilization exceeds 85%'

          - alert: ServiceHighMemoryUsage
            expr: memory_usage{job="sentinelops-services"} > 500000000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'High memory usage on {{ $labels.service }}'
              description: 'Memory usage exceeds 500MB for 10 minutes'

          # Control plane
          - alert: ControlPlaneServiceDown
            expr: up{job="sentinelops-control-plane"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'Control plane service {{ $labels.instance }} is down'
              description: 'Control plane service {{ $labels.instance }} has been down for 2 minutes'

          - alert: IncidentEngineHighOpenGroups
            expr: open_correlation_groups{job="sentinelops-control-plane"} > 50
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'High number of open correlation groups'
              description: 'Incident engine has more than 50 open correlation groups'

          - alert: AnomalyEngineNoAnomalies
            expr: rate(anomalies_emitted_total{job="sentinelops-control-plane"}[10m]) == 0
            for: 10m
            labels:
              severity: info
            annotations:
              summary: 'No anomalies detected recently'
              description: "Anomaly engine hasn't emitted any anomalies in 10 minutes"

      - name: sentinelops.platform
        interval: 30s
        rules:
          - alert: APIDown
            expr: up{job="sentinelops-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Platform API is down'
              description: 'The platform API has been down for more than 1 minute'

          - alert: APIHighErrorRate
            expr: |
              sum(rate(api_requests_total{job="sentinelops-api",status=~"5.."}[5m]))
              /
              sum(rate(api_requests_total{job="sentinelops-api"}[5m]))
              > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Platform API high error rate'
              description: 'Platform API error rate exceeds 5%'

      - name: sentinelops.observability
        interval: 30s
        rules:
          - alert: PrometheusDown
            expr: up{job="prometheus"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Prometheus is down'
              description: 'Prometheus has been down for more than 1 minute'

          - alert: PrometheusHighScrapeFailures
            expr: |
              sum(rate(prometheus_target_scrapes_sample_limit_exceeded_total[5m])) by (job)
              > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Prometheus scrape sample limit exceeded'
              description: 'Prometheus scrape for {{ $labels.job }} is hitting sample limits'

          - alert: OTelCollectorDown
            expr: up{job="otel-collector"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'OTel Collector is down'
              description: 'OpenTelemetry Collector has been down for more than 1 minute'

          - alert: LokiDown
            expr: up{job="loki"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Loki is down'
              description: 'Loki log aggregation has been down for more than 1 minute'
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: sentinelops
---
apiVersion: v1
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        monitor: sentinelops

    # Alerting configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    # Rule files
    rule_files:
      - '/etc/prometheus/alerts/*.yml'

    scrape_configs:
      # The OTel Collector re-exports app metrics on :8889.
      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector:8889']

      # Prometheus scrapes itself.
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # Direct /metrics endpoints exposed by each data-plane service.
      # (Reachable by container name when services run in the app compose network.)
      - job_name: sentinelops-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - 'api-gateway:8080'
              - 'user-service:8081'
              - 'order-service:8082'
              - 'payment-service:8083'
              - 'notification-service:8084'
        # Don't fail the whole scrape pool while services are still coming up.
        honor_labels: true

      # Control plane — SentinelOps observing itself.
      - job_name: sentinelops-control-plane
        metrics_path: /metrics
        static_configs:
          - targets:
              - 'incident-engine:8090'
              - 'anomaly-engine:8091'
              - 'ingestor:8095'
        honor_labels: true

      # Platform API
      - job_name: sentinelops-api
        metrics_path: /metrics
        static_configs:
          - targets: ['api:4000']
        honor_labels: true

      # Loki
      - job_name: loki
        static_configs:
          - targets: ['loki:3100']

      # Alertmanager
      - job_name: alertmanager
        static_configs:
          - targets: ['alertmanager:9093']
