apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: sentinelops
  name: sentinelops
---
apiVersion: v1
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical'
          continue: true

    receivers:
      - name: 'default'
        # Demo receiver intentionally has no external delivery. Configure a real
        # receiver before enabling external notifications.

      - name: 'critical'

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'service']
