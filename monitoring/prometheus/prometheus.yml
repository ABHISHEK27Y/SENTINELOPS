global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: sentinelops

scrape_configs:
  # The OTel Collector re-exports app metrics on :8889.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Prometheus scrapes itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Direct /metrics endpoints exposed by each data-plane service.
  # (Reachable by container name when services run in the app compose network.)
  - job_name: sentinelops-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - "api-gateway:8080"
          - "user-service:8081"
          - "order-service:8082"
          - "payment-service:8083"
          - "notification-service:8084"
    # Don't fail the whole scrape pool while services are still coming up.
    honor_labels: true

  # Control plane — SentinelOps observing itself.
  - job_name: sentinelops-control-plane
    metrics_path: /metrics
    static_configs:
      - targets:
          - "incident-engine:8090"
          - "anomaly-engine:8091"
          - "ingestor:8095"
    honor_labels: true
