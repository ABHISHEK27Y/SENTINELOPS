global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true

receivers:
  - name: 'default'
    # In production, configure webhook/email/Slack/PagerDuty here
    webhook_configs:
      - url: 'http://alertmanager-webhook:5000/alerts'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://alertmanager-webhook:5000/alerts/critical'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']